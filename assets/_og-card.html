<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --ink:#09090B; --paper:#ffffff; --accent:#DBFE52;
    --ink-soft:rgba(9,9,11,.62); --ink-faint:rgba(9,9,11,.34); --rule:rgba(9,9,11,.14);
    --f-sans:'Inter','Helvetica Neue',system-ui,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  body { width:1200px; height:630px; background:var(--paper); font-family:var(--f-sans);
         color:var(--ink); -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11"; }
  .card { position:relative; width:1200px; height:630px; overflow:hidden; }

  /* ── right third: portrait on a faint paper panel, bleeding off the bottom ── */
  .photo-col { position:absolute; right:0; top:0; width:420px; height:630px;
               background:#F6F6F4; border-left:1px solid var(--rule); overflow:hidden; }
  .photo { position:absolute; left:50%; bottom:-30px; transform:translateX(-48%);
           height:566px; width:auto; filter:saturate(.9) contrast(1.04); }
  .photo-fade { position:absolute; left:0; bottom:0; width:100%; height:96px;
                background:linear-gradient(to top,#F6F6F4 8%,rgba(246,246,244,0)); }

  /* frame ticks — same brutalist register as the site */
  .tick { position:absolute; width:24px; height:24px; border:1.5px solid var(--ink); }
  .tick.tl { top:38px; left:40px; border-right:0; border-bottom:0; }
  .tick.bl { bottom:38px; left:40px; border-right:0; border-top:0; }

  .accent-edge { position:absolute; left:0; top:0; width:8px; height:100%; background:var(--accent); }

  .top { position:absolute; top:52px; left:78px; display:flex; align-items:center; gap:11px; }
  .dot { width:10px; height:10px; background:var(--accent); }
  .brand { font-family:var(--f-mono); font-size:16px; font-weight:500; letter-spacing:.17em; }
  .brand em { font-style:normal; color:var(--ink-faint); }

  /* ── left column: everything lives inside 78 → 700 ── */
  .body { position:absolute; left:78px; top:150px; width:622px; }
  .kicker { font-family:var(--f-mono); font-size:13px; letter-spacing:.19em; color:var(--ink-soft);
            padding-bottom:13px; border-bottom:1px solid var(--ink); display:block; }
  h1 { font-size:96px; line-height:.88; font-weight:900; letter-spacing:-.048em; margin-top:26px; }
  h1 .b { color:var(--ink-faint); }
  .role { margin-top:28px; font-size:23px; line-height:1.36; font-weight:600;
          letter-spacing:-.012em; }
  .role mark { background:var(--accent); color:var(--ink); padding:.05em .16em;
               box-decoration-break:clone; -webkit-box-decoration-break:clone; }

  .rail { position:absolute; left:78px; bottom:58px; display:flex;
          border:1px solid var(--rule); background:#fff; }
  .cell { padding:12px 20px; border-right:1px solid var(--rule); }
  .cell:last-child { border-right:0; }
  .cell .k { font-family:var(--f-mono); font-size:10px; letter-spacing:.18em; color:var(--ink-faint); }
  .cell .v { font-size:15px; font-weight:700; letter-spacing:-.012em; margin-top:5px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-col">
      <img class="photo" src="base-photo.png" alt="" />
      <div class="photo-fade"></div>
    </div>

    <div class="accent-edge"></div>
    <div class="tick tl"></div>
    <div class="tick bl"></div>

    <div class="top"><span class="dot"></span><span class="brand">ADARSH GOLAIT <em>— PORTFOLIO</em></span></div>

    <div class="body">
      <span class="kicker">REDEFINING LIMITS, CREATING ENDLESS POSSIBILITIES</span>
      <h1>ADARSH<br /><span class="b">GOLAIT</span></h1>
      <p class="role">Mechanical engineer.<br /><mark>Operations &amp; program build</mark>, hands-on.</p>
    </div>

    <div class="rail">
      <div class="cell"><div class="k">EDUCATION</div><div class="v">IITGN '23 · Gold Medalist</div></div>
      <div class="cell"><div class="k">CURRENT</div><div class="v">Axis Bank · Mumbai</div></div>
    </div>
  </div>
</body>
</html>
