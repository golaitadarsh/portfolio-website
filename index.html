<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adarsh Golait — mechanical engineer from IIT Gandhinagar (Gold Medalist). Operations & program build, hands-on. Axis Bank framework architecture, hardware prototyping, student-community leadership." />
    <meta name="author" content="Adarsh Golait" />
    <meta name="theme-color" content="#09090B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://adarsh-golait.vercel.app/" />
    <title>Adarsh Golait — Portfolio</title>

    <!-- Social share cards. og:image must be absolute — LinkedIn and X fetch it
         from their own crawlers, which have no page context to resolve a
         relative path against. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adarsh Golait — Portfolio" />
    <meta property="og:url" content="https://adarsh-golait.vercel.app/" />
    <meta property="og:title" content="Adarsh Golait — Mechanical Engineer &amp; Operations Builder" />
    <meta property="og:description" content="IIT Gandhinagar Gold Medalist. Cut a bank profitability pipeline by 90%, architected a PySpark framework adopted across production systems, and ran ₹80L+ programs for a 3,600+ student community." />
    <meta property="og:image" content="https://adarsh-golait.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Adarsh Golait — portfolio card: mechanical engineer, operations and program build, IITGN '23 Gold Medalist, Axis Bank Mumbai." />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adarsh Golait — Mechanical Engineer &amp; Operations Builder" />
    <meta name="twitter:description" content="IIT Gandhinagar Gold Medalist. Cut a bank profitability pipeline by 90%, architected a PySpark framework adopted across production systems, and ran ₹80L+ programs for a 3,600+ student community." />
    <meta name="twitter:image" content="https://adarsh-golait.vercel.app/og.jpg" />
    <meta name="twitter:image:alt" content="Adarsh Golait — portfolio card: mechanical engineer, operations and program build, IITGN '23 Gold Medalist, Axis Bank Mumbai." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/loader.css" />
    <script src="/loader.js"></script>

    <!-- Vercel Web Analytics. Loaded as a plain script instead of the npm
         package so the build stays dependency-free; the endpoint only exists
         once Web Analytics is enabled on the project. The queue shim must run
         first so calls made before the script lands are not dropped. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <script>
      // Run before any module script so Chrome doesn't restore the previous
      // scroll position between reloads — otherwise the page lands mid-zoom.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
